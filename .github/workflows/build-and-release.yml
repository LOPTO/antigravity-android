name: Build Simplified Chinese APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-zh.*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt zipalign apksigner file zip unzip gzip

      - name: Build and verify signed APK
        env:
          APK_SIGNING_KEYSTORE_BASE64: ${{ secrets.APK_SIGNING_KEYSTORE_BASE64 }}
          AGY_SIGNING_STORE_PASSWORD: ${{ secrets.APK_SIGNING_STORE_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.APK_SIGNING_CERT_SHA256 }}
        run: |
          version=$(sed -n 's/^APP_VERSION_NAME=//p' config/app.env)
          version_code=$(sed -n 's/^APP_VERSION_CODE=//p' config/app.env)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "v$version" ]
          fi

          umask 077
          export AGY_SIGNING_KEYSTORE="$RUNNER_TEMP/antigravity-zh.p12"
          trap 'rm -f "$AGY_SIGNING_KEYSTORE"' EXIT
          printf '%s' "${APK_SIGNING_KEYSTORE_BASE64:?Configure the Fork signing keystore secret}" \
            | base64 --decode > "$AGY_SIGNING_KEYSTORE"
          unset APK_SIGNING_KEYSTORE_BASE64

          bash build.sh --standard --prefix antigravity-zh
          apk=dist/antigravity-zh.apk
          signer=$(apksigner verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          [ "$signer" = "${EXPECTED_CERT_SHA256:?Configure the Fork certificate fingerprint}" ]
          metadata=$(aapt dump badging "$apk")
          grep -F "package: name='com.agy' versionCode='$version_code' versionName='$version'" <<< "$metadata"
          if grep -Fq 'application-debuggable' <<< "$metadata"; then
            echo 'Release APK is debuggable' >&2
            exit 1
          fi
          aapt dump configurations "$apk" | grep -Fx 'zh-rCN'
          bash web/tests/selftest.sh "$apk"
          (cd dist && sha256sum antigravity-zh.apk > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: antigravity-zh
          if-no-files-found: error
          path: |
            dist/antigravity-zh.apk
            dist/SHA256SUMS.txt

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: antigravity-zh
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          name: Antigravity Android 简体中文 ${{ github.ref_name }}
          body: |
            标准版 ARM64 APK。默认简体中文，可在「设置 → 外观 → 界面语言」切换到 English。

            包名为 `com.agy`。本 Fork 使用独立签名，已有同包名应用的设备请先核对证书和数据迁移方式。
          fail_on_unmatched_files: true
          files: |
            dist/antigravity-zh.apk
            dist/SHA256SUMS.txt
